name: Trend Following — Weekly Rebalancing

on:
  schedule:
    # GitHub Actions는 정각/30분처럼 몰리는 시각에 스케줄이 지연·누락되는 경우가 잦아
    # (공식 문서상 알려진 현상), 분침을 비껴 잡고 45분 뒤 백업 cron을 추가로 둔다.
    # 주간 리밸런싱: 월요일 KST 07:37 (UTC 22:37, 일요일) + 백업(23:22)
    - cron: '37 22 * * 0'
    - cron: '22 23 * * 0'
    # 일일 추적: 화~금 KST 07:37 (UTC 22:37, 월~목) + 백업(23:22)
    - cron: '37 22 * * 1-4'
    - cron: '22 23 * * 1-4'
    # 토요일 KST 07:37 (UTC 금요일 22:37) + 백업(23:22)
    - cron: '37 22 * * 5'
    - cron: '22 23 * * 5'
    # 일요일 KST 07:37 (UTC 토요일 22:37) + 백업(23:22)
    - cron: '37 22 * * 6'
    - cron: '22 23 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: false
        default: 'weekly'
        type: choice
        options: [weekly, daily]

permissions:
  contents: write
  actions: read    # 중복 실행 가드에서 실행 이력 조회용

# 알림: Telegram 우선(만료 없음) / Kakao 폴백
env:
  TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
  KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
  KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 중복 실행 방지 — 오늘 이미 성공한 실행이 있으면 스킵
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "[가드] 수동 실행 — 스킵 안 함"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(gh run list --repo "${{ github.repository }}" \
            --workflow=trend_rebalancing.yml --status success --limit 20 \
            --json createdAt --jq "[.[] | select(.createdAt | startswith(\"$TODAY\"))] | length")
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "[가드] 오늘($TODAY) 이미 성공한 실행 ${COUNT}건 — 백업 실행 스킵"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "[가드] 오늘($TODAY) 성공 실행 없음 — 진행"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        if: steps.guard.outputs.skip != 'true'
        run: pip install yfinance pandas numpy requests lxml beautifulsoup4 curl_cffi

      - name: 실행 모드 결정
        id: mode
        if: steps.guard.outputs.skip != 'true'
        run: |
          # workflow_dispatch 입력 우선, 없으면 요일 기반
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ -n "$INPUT_MODE" ]; then
            echo "mode=$INPUT_MODE" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%u)" = "7" ]; then
            # 일요일 UTC = 월요일 KST → 주간 리밸런싱
            echo "mode=weekly" >> $GITHUB_OUTPUT
          else
            # 월~금 UTC (화~토 KST) → 일일 추적
            echo "mode=daily" >> $GITHUB_OUTPUT
          fi

      - name: 알림 채널 자격증명 확인
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "TELEGRAM_BOT_TOKEN : $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo SET || echo 'NOT SET')"
          echo "TELEGRAM_CHAT_ID   : $([ -n "$TELEGRAM_CHAT_ID" ]   && echo SET || echo 'NOT SET')"
          echo "KAKAO_REST_API_KEY : $([ -n "$KAKAO_REST_API_KEY" ] && echo SET || echo 'NOT SET')"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] && [ -z "$KAKAO_REST_API_KEY" ]; then
            echo "::warning::알림 채널이 하나도 설정되지 않았습니다 — 추세추종 메시지가 발송되지 않습니다. GitHub Settings > Secrets and variables > Actions에서 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID를 등록하세요."
          fi

      - name: 추세 추종 파이프라인 실행
        if: steps.guard.outputs.skip != 'true'
        run: |
          cd tools/stock_portfolio
          python trend_pipeline.py --mode ${{ steps.mode.outputs.mode }}

      - name: PWA 데이터 내보내기
        if: steps.guard.outputs.skip != 'true'
        env:
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: |
          cd tools/stock_portfolio
          python export_pwa_data.py
          python export_sector_data.py
          python export_price_lookup.py
          python strategy_gates.py

      - name: 결과 커밋 및 푸시 (충돌 시 최대 3회 재시도 — 실패를 숨기지 않음)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/stock_portfolio/cache/ docs/data/ || true

          if git diff --staged --quiet; then
            echo "[commit] 변경사항 없음 — 커밋 스킵"
            exit 0
          fi
          git commit -m "trend: ${{ steps.mode.outputs.mode }} $(TZ='America/New_York' date +%Y-%m-%d)"

          for i in 1 2 3; do
            if git push; then
              echo "[commit] push 성공 (시도 $i)"
              exit 0
            fi
            echo "[commit] push 실패 (시도 $i/3) — origin 최신화 후 재시도"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git merge -X ours origin/main --no-edit; }
          done
          echo "::error::push 3회 모두 실패 — 데이터가 원격에 반영되지 않았습니다" >&2
          exit 1

      - name: 추세추종 알림 발송 확인 (앱 데이터 커밋 이후 검증 — 커밋은 막지 않음)
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          python - <<'EOF'
          import json, sys

          try:
              with open('tools/stock_portfolio/cache/notify_status.json', encoding='utf-8') as f:
                  status = json.load(f)
          except Exception as e:
              print(f"::warning::notify_status.json 읽기 실패 — 알림 발송 여부를 확인할 수 없습니다: {e}")
              sys.exit(0)

          if status.get("sent"):
              print(f"[notify-check] 추세추종 알림 발송 확인됨 (mode={status.get('mode')}, date={status.get('date')})")
          else:
              reason = status.get("reason", "알 수 없는 이유")
              print(f"::error::추세추종 알림({status.get('mode')}, {status.get('date')})이 발송되지 않았습니다 — {reason}")
              sys.exit(1)
          EOF

      - name: 데이터 신선도 최종 검증 (2일 이상 지연 시 알림)
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          python - <<'EOF'
          import json, sys, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo

          try:
              with open('docs/data/trend_latest.json', encoding='utf-8') as f:
                  data = json.load(f)
          except Exception as e:
              print(f"[freshness] trend_latest.json 읽기 실패: {e}", file=sys.stderr)
              sys.exit(0)

          file_date = data.get('date', '')
          today_et  = datetime.now(ZoneInfo('America/New_York')).strftime('%Y-%m-%d')
          try:
              stale_days = (datetime.strptime(today_et, '%Y-%m-%d')
                            - datetime.strptime(file_date, '%Y-%m-%d')).days
          except Exception:
              stale_days = 99

          print(f"[freshness] 파일 날짜={file_date}  기준일={today_et}  지연={stale_days}일")
          if stale_days < 2:
              sys.exit(0)   # 주말 등 1일 지연은 정상 범위

          msg = (
              f"[앱 데이터 지연 경고]\n"
              f"trend_latest.json이 {stale_days}일째 갱신되지 않았습니다 (파일 날짜: {file_date}).\n"
              f"워크플로 단계는 성공했지만 실제 데이터가 반영되지 않았을 수 있습니다.\n"
              f"https://github.com/dhkong01/claude-agents/actions"
          )
          subprocess.run(["python", "tools/stock_portfolio/notify.py", msg])
          EOF

      - name: 실패 시 알림
        if: failure() && steps.guard.outputs.skip != 'true'
        run: |
          python tools/stock_portfolio/notify.py "trend_rebalancing 워크플로가 실패했습니다.
          앱 데이터가 업데이트되지 않았을 수 있습니다.
          https://github.com/dhkong01/claude-agents/actions" || true
