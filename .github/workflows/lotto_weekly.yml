name: Lotto Weekly Prediction

on:
  schedule:
    - cron: '0 3 * * 1'   # UTC 03:00 월요일 = KST 12:00 월요일 (토요일 당첨 smok95 반영 후)
  workflow_dispatch:       # Actions 탭 > Run workflow 버튼으로 수동 실행 가능

permissions:
  contents: write          # history.json + last_run.txt 커밋

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 35    # history.json 증분(빠름) + ml_analyze(~5분) + 여유

    steps:
      # ── 1. 체크아웃 ────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python + 의존성 ───────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/lotto/requirements.txt

      - name: 의존성 설치
        run: pip install -r tools/lotto/requirements.txt

      # ── 3. Secrets 상태 확인 (경고만 — 실패 안 함) ──────────────
      - name: Secrets 상태 출력
        env:
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "=== GitHub Secrets 설정 상태 ==="
          [ -n "$KAKAO_REST_API_KEY"  ] && echo "  KAKAO_REST_API_KEY : SET"  || echo "  KAKAO_REST_API_KEY : NOT SET"
          [ -n "$KAKAO_REFRESH_TOKEN" ] && echo "  KAKAO_REFRESH_TOKEN: SET"  || echo "  KAKAO_REFRESH_TOKEN: NOT SET"
          [ -n "$TELEGRAM_BOT_TOKEN"  ] && echo "  TELEGRAM_BOT_TOKEN : SET"  || echo "  TELEGRAM_BOT_TOKEN : NOT SET"
          if [ -z "$KAKAO_REST_API_KEY" ] && [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "[경고] 알림 수단 없음 — 예측·커밋은 정상 진행, 전송만 스킵됩니다"
            echo "       설정: GitHub Settings > Secrets > Actions"
          else
            echo "Secrets OK"
          fi

      # ── 4. 데이터 수집 (증분) ───────────────────────────────
      - name: 데이터 수집 (lotto_history.json 증분 업데이트)
        run: |
          echo "=== 수집 전 현황 ==="
          python -c "
          import json, pathlib
          p = pathlib.Path('tools/lotto/data/lotto_history.json')
          if p.exists():
              d = json.loads(p.read_text(encoding='utf-8'))
              print(f'  기존 history: 최신={d[\"last_draw\"]}회, 총{d[\"total_records\"]}건')
          else:
              print('  history.json 없음 — 전체 수집 필요 (시간 소요)')
          "
          python tools/lotto/collect.py
          echo "=== 수집 완료 ==="
          python -c "
          import json
          d = json.load(open('tools/lotto/data/lotto_history.json', encoding='utf-8'))
          print(f'  최신={d[\"last_draw\"]}회, 총{d[\"total_records\"]}건')
          "

      # ── 5. 통계 정규화 ───────────────────────────────────────
      - name: 통계 정규화
        run: python tools/lotto/normalize.py

      # ── 6. ML 분석 ──────────────────────────────────────────
      - name: ML 정합성 분석 (3모델 x 5000 부트스트랩)
        run: python tools/lotto/ml_analyze.py

      # ── 7. 예측 생성 ─────────────────────────────────────────
      - name: 5게임 예측
        run: python tools/lotto/predict.py

      # ── 8. 예측 결과 확인 ────────────────────────────────────
      - name: 예측 결과 출력
        run: |
          python -c "
          import json
          d = json.load(open('tools/lotto/data/lotto_prediction.json', encoding='utf-8'))
          print(f'=== 제{d[\"draw\"]}회 예측 ({len(d.get(\"games\",[]))}게임) ===')
          for g in d.get('games', []):
              idx = d['games'].index(g)
              print(f'  {chr(65+idx)} [{g.get(\"strategy\",\"?\")}]: {g[\"numbers\"]}  합{g[\"sum\"]}  {g.get(\"combined_score\", g[\"overall_coherence\"]):.1f}%')
          "

      # ── 9. 카카오톡 / Telegram 전송 ─────────────────────────
      - name: 카카오톡 / Telegram 전송
        continue-on-error: true   # 전송 실패해도 history 커밋은 진행
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python tools/lotto/github_actions/send_notify.py

      # ── 10. history.json + 실행 기록 커밋 ────────────────────
      - name: history.json 및 실행 기록 저장
        run: |
          git config user.email "github-actions@github.com"
          git config user.name  "github-actions[bot]"
          echo "$(date -u '+%Y-%m-%d %H:%M UTC')" > tools/lotto/last_run.txt
          git add tools/lotto/last_run.txt
          git add tools/lotto/data/lotto_history.json 2>/dev/null || echo "history.json: 추가 불필요"
          git diff --cached --quiet && echo "변경 없음 — 커밋 생략" || \
            git commit -m "chore(lotto): 실행 기록 $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main || true
          git push || echo "[경고] push 실패 — 다음 실행에서 재시도"
