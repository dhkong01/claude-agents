name: Market Report Data

on:
  schedule:
    # 매일 KST 10:00 기준으로 한국·미국 데이터를 함께 갱신한다.
    # GitHub 스케줄은 지연·누락이 잦다(실측: 예정보다 약 3시간 늦거나 아예 실행 안 됨). 그래서
    # 같은 날 여러 번 트리거를 걸고, 각 실행은 "오늘 10:00 KST 이후 이미 성공한 실행이 있으면"
    # 스스로 취소한다(아래 guard). 앞선 트리거가 늦거나 실패해도 뒤의 트리거가 대신 갱신한다.
    # 분침은 정각을 피해 몰림을 줄였다.  KST = UTC + 9
    - cron: '7 1 * * *'     # 10:07 KST (기준 실행)
    - cron: '52 1 * * *'    # 10:52 KST
    - cron: '37 3 * * *'    # 12:37 KST
    - cron: '7 5 * * *'     # 14:07 KST
  workflow_dispatch:
    inputs:
      only:
        description: '새로 받을 시장 (all=전체, kr=한국, us=미국). 스케줄 실행은 항상 all'
        required: false
        default: 'all'
        type: choice
        options: [all, kr, us]

permissions:
  contents: write
  actions: write    # 중복 실행 가드: 이력 조회 + 스킵할 때 자기 자신 취소

# 같은 데이터를 쓰므로 동시 실행을 막는다 (밀린 실행은 대기, 취소하지 않음)
concurrency:
  group: market-data
  cancel-in-progress: false

# ── 저장소 용량을 가볍게 유지하는 방식 ─────────────────────────────────────────
# 갱신 데이터(market_report.json, mr/)는 main 에 커밋하지 않는다. 대신 `market-data` 브랜치에
# "항상 커밋 1개"만 남기고 강제 푸시한다(히스토리가 쌓이지 않음). Pages 배포(pages.yml)가
# 이 브랜치를 docs/data/ 에 합쳐서 올린다.
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 중복 실행 방지 — 오늘 10:00 KST 이후 이미 성공했으면 스킵
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "[가드] 수동 실행 — 스킵 안 함"
            exit 0
          fi
          # 오늘 10:00 KST = 오늘 01:00 UTC. 트리거는 모두 01:07 UTC 이후라 UTC 날짜가 KST 날짜와 같다.
          SINCE="$(date -u +%Y-%m-%d)T01:00:00Z"
          COUNT=$(gh run list --repo "${{ github.repository }}" \
            --workflow=market_report.yml --status success --limit 30 \
            --json createdAt --jq "[.[] | select(.createdAt > \"$SINCE\")] | length")
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "[가드] 오늘 10:00 KST 이후 성공한 실행 ${COUNT}건 — 이번 실행은 스킵"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "[가드] 오늘 성공한 실행 없음 — 진행"
          fi

      # 스킵이면 자기 자신을 취소한다. 성공(success)으로 끝나면 pages.yml 이 의미 없이 재배포하므로
      # 'cancelled'로 끝내 재배포를 막는다(pages.yml 은 success 일 때만 배포).
      - name: 스킵 — 실행 취소
        if: steps.guard.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true
          sleep 60   # 취소가 반영될 때까지 대기(이후 단계는 모두 skip 조건이라 실제 작업은 없음)

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        if: steps.guard.outputs.skip != 'true'
        run: pip install yfinance requests curl_cffi

      - name: 수집 대상 시장 결정
        id: scope
        if: steps.guard.outputs.skip != 'true'
        run: |
          # 스케줄 실행은 항상 한국+미국 전체(날짜가 섞여 보이지 않도록). 수동 실행만 선택 가능.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ONLY="${{ github.event.inputs.only }}"
          else
            ONLY=all
          fi
          echo "only=${ONLY:-all}" >> "$GITHUB_OUTPUT"
          echo "수집 대상: ${ONLY:-all}"

      # 직전 데이터를 작업 폴더로 가져온다. 한쪽 시장만 갱신할 때 반대쪽 데이터를 유지하려면 필요하다.
      - name: market-data 브랜치 준비
        if: steps.guard.outputs.skip != 'true'
        run: |
          if git ls-remote --exit-code --heads origin market-data >/dev/null 2>&1; then
            git fetch --depth 1 origin market-data
            git worktree add --detach market-data FETCH_HEAD
            echo "기존 market-data 브랜치를 가져왔습니다."
          else
            git worktree add --detach market-data HEAD
            git -C market-data rm -rfq .
            find market-data -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            echo "::notice::market-data 브랜치가 아직 없어 새로 만듭니다."
          fi

      # 한국 지수 수집에 실패하면 스크립트가 exit 1 로 끝나고 이후 단계는 실행되지 않는다(기존 데이터 유지).
      - name: 마켓리포트 데이터 수집
        if: steps.guard.outputs.skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
          MR_DATA_DIR: ${{ github.workspace }}/market-data
        run: python tools/market_report/export_market_report.py --only ${{ steps.scope.outputs.only }}

      - name: market-data 브랜치에 단일 커밋으로 강제 푸시 (히스토리 누적 없음)
        if: steps.guard.outputs.skip != 'true'
        working-directory: market-data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "[publish] 변경사항 없음 — 푸시 스킵"
            exit 0
          fi
          # 부모 없는 새 커밋 1개로 대체 → 브랜치에는 항상 최신 스냅샷만 남는다
          git checkout -q --orphan data-snapshot
          git add -A
          git commit -q -m "market-data: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M') KST (${{ steps.scope.outputs.only }})"

          for i in 1 2 3; do
            if git push --force origin data-snapshot:market-data; then
              echo "[publish] push 성공 (시도 $i)"
              exit 0
            fi
            echo "[publish] push 실패 (시도 $i/3) — 5초 후 재시도"
            sleep 5
          done
          echo "::error::push 3회 모두 실패 — 데이터가 원격에 반영되지 않았습니다" >&2
          exit 1
