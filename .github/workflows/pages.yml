name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  # GITHUB_TOKEN으로 만든 커밋(아래 워크플로들의 자동 일일 커밋)은 push 이벤트로
  # 다른 워크플로를 트리거하지 않는 GitHub의 기본 정책 때문에, docs/ 데이터가
  # 갱신돼도 위 push 트리거만으로는 재배포되지 않는다. 해당 워크플로들이
  # 끝날 때마다 명시적으로 재배포하도록 workflow_run으로 보완한다.
  workflow_run:
    workflows:
      - "News & Investment Ideas — Daily"
      - "Trend Following — Weekly Rebalancing"
      - "Portfolio Daily Report"
      - "Market Report Data"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 마켓리포트 데이터는 main 에 커밋하지 않고 market-data 브랜치(커밋 1개)에만 둔다.
      # 배포할 때 docs/data/ 로 합쳐서 올린다. 브랜치가 없으면 사이트가 샘플 데이터로 동작한다.
      - name: 마켓리포트 데이터 합치기 (market-data 브랜치)
        run: |
          if git ls-remote --exit-code --heads origin market-data >/dev/null 2>&1; then
            git fetch --depth 1 origin market-data
            mkdir -p docs/data
            git archive FETCH_HEAD | tar -x -C docs/data
            echo "market-data 병합 완료: $(find docs/data/mr -type f 2>/dev/null | wc -l) files"
          else
            echo "::warning::market-data 브랜치가 없습니다 — 마켓리포트가 샘플 데이터로 표시됩니다."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
