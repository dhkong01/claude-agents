name: Market Report Data

on:
  schedule:
    # 평일 2회 (분침은 정각을 피해 지연·누락 위험을 줄임)
    #  - KST 07:12 (UTC 22:12, 일~목): 미국 마감 반영
    #  - KST 17:07 (UTC 08:07, 월~금): 한국 마감·수급 확정 반영 (장 마감 15:30, 종가 확정 후)
    - cron: '12 22 * * 0-4'
    - cron: '7 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# 같은 데이터 파일을 쓰므로 동시 실행을 막는다 (밀린 실행은 대기, 취소하지 않음)
concurrency:
  group: market-report-data
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install yfinance requests curl_cffi

      # 한국 지수 수집에 실패하면 스크립트가 exit 1 로 끝나고 기존 JSON은 그대로 유지된다.
      - name: 마켓리포트 데이터 수집
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/market_report/export_market_report.py

      - name: 결과 커밋 및 푸시 (충돌 시 최대 3회 재시도 — 실패를 숨기지 않음)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/market_report.json

          if git diff --staged --quiet; then
            echo "[commit] 변경사항 없음 — 커밋 스킵"
            exit 0
          fi
          git commit -m "market-report: data $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M')"

          for i in 1 2 3; do
            if git push; then
              echo "[commit] push 성공 (시도 $i)"
              exit 0
            fi
            echo "[commit] push 실패 (시도 $i/3) — origin 최신화 후 재시도"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git merge -X ours origin/main --no-edit; }
          done
          echo "::error::push 3회 모두 실패 — 데이터가 원격에 반영되지 않았습니다" >&2
          exit 1
