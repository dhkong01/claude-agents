name: News & Investment Ideas — Daily

on:
  schedule:
    # 매일 KST 07:00 (UTC 22:00, 전일)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r tools/news_app/requirements.txt

      - name: 뉴스·투자아이디어 파이프라인 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd tools/news_app
          python run_pipeline.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/news_app/cache/ docs/news-app/data/ || true
          git diff --staged --quiet || git commit -m "news: daily $(TZ='Asia/Seoul' date +%Y-%m-%d)"
          git push || true
