name: News & Investment Ideas — Daily

on:
  schedule:
    # GitHub Actions 스케줄은 정각/30분처럼 몰리는 시각에 지연·누락이 잦아
    # 분침을 비껴 잡고 45분 뒤 백업 cron을 둔다.
    # 중복 실행 가드는 두지 않는다 — 파이프라인이 KST 당일 캐시가 있으면 Gemini 호출을
    # 건너뛰고, 산출물이 동일하면 커밋 자체가 no-op이라 백업 실행은 사실상 무해하다.
    - cron: '55 20 * * *'   # UTC 20:55 ≈ KST 05:55
    - cron: '40 21 * * *'   # 백업 (+45분)
  workflow_dispatch:

permissions:
  contents: write   # 데이터 커밋 권한

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r tools/news_app/requirements.txt

      - name: Gemini 연결 점검 (실패해도 계속 — 원인 진단용 로그)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY 시크릿이 비어 있음"
            exit 0
          fi
          M="${GEMINI_MODEL_LIGHT:-gemini-3.5-flash-lite}"
          code=$(curl -s -o /tmp/g.json -w '%{http_code}' \
            "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent?key=$GEMINI_API_KEY" \
            -H 'Content-Type: application/json' -d '{"contents":[{"parts":[{"text":"ping"}]}]}')
          echo "Gemini $M -> HTTP $code"
          head -c 600 /tmp/g.json; echo

      - name: 뉴스·투자아이디어 파이프라인 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd tools/news_app
          python run_pipeline.py

      - name: 결과 커밋 및 푸시 (충돌 시 최대 3회 재시도 — 실패를 숨기지 않음)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/news_app/cache/ docs/news-app/data/ || true

          if git diff --staged --quiet; then
            echo "[commit] 변경사항 없음 — 커밋 스킵"
            exit 0
          fi
          git commit -m "news: daily $(TZ='Asia/Seoul' date +%Y-%m-%d)"

          for i in 1 2 3; do
            if git push; then
              echo "[commit] push 성공 (시도 $i)"
              exit 0
            fi
            echo "[commit] push 실패 (시도 $i/3) — origin 최신화 후 재시도"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git merge -X ours origin/main --no-edit; }
          done
          echo "::error::push 3회 모두 실패 — 데이터가 원격에 반영되지 않았습니다" >&2
          exit 1
