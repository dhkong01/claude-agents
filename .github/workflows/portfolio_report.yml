name: Portfolio Daily Report

on:
  schedule:
    # 기존 '0-5'(일~금)는 토요일이 통째로 빠지는 버그였음 → '0-6'(매일)으로 수정.
    # 분침도 정각(0분)에서 비껴 잡고 45분 뒤 백업을 둬 GitHub 스케줄 지연/누락에 대비.
    - cron: '7 23 * * 0-6'     # UTC 23:07 ≈ KST 08:07 (trend_rebalancing 이후 실행)
    - cron: '52 23 * * 0-6'    # 백업 (+45분, 아래 가드로 중복 발송 방지)
  workflow_dispatch:           # 수동 실행 가능

permissions:
  contents: write              # latest_report.txt 커밋 권한
  actions: read                 # 중복 실행 가드에서 실행 이력 조회용

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 중복 실행 방지 — 오늘 이미 성공한 실행이 있으면 스킵
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "[가드] 수동 실행 — 스킵 안 함"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(gh run list --repo "${{ github.repository }}" \
            --workflow=portfolio_report.yml --status success --limit 20 \
            --json createdAt --jq "[.[] | select(.createdAt | startswith(\"$TODAY\"))] | length")
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "[가드] 오늘($TODAY) 이미 성공한 실행 ${COUNT}건 — 백업 실행 스킵 (카카오톡 중복 발송 방지)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "[가드] 오늘($TODAY) 성공 실행 없음 — 진행"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        if: steps.guard.outputs.skip != 'true'
        run: pip install yfinance requests curl_cffi

      - name: 리포트 생성 + 카카오톡 전송 + Git 커밋
        if: steps.guard.outputs.skip != 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: python tools/stock_portfolio/github_actions/report.py

      - name: 실패 시 카카오톡 알림
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          python - <<'EOF'
          import os, requests, json

          rest_key      = os.environ.get("KAKAO_REST_API_KEY", "")
          refresh_token = os.environ.get("KAKAO_REFRESH_TOKEN", "")
          if not rest_key or not refresh_token:
              print("[Kakao] Secret 미설정 — 알림 생략")
              raise SystemExit(0)

          r = requests.post("https://kauth.kakao.com/oauth/token", data={
              "grant_type": "refresh_token",
              "client_id": rest_key,
              "refresh_token": refresh_token,
          }, timeout=10)
          token = r.json().get("access_token", "")
          if not token:
              print("[Kakao] 토큰 갱신 실패:", r.text)
              raise SystemExit(0)

          msg = (
              "[포트폴리오 리포트 실패]\n"
              "portfolio_report 워크플로가 실패했습니다.\n"
              "카카오톡 발송 또는 리포트 커밋이 안 됐을 수 있습니다.\n"
              "GitHub Actions 로그를 확인해 주세요.\n"
              "https://github.com/dhkong01/claude-agents/actions"
          )
          requests.post(
              "https://kapi.kakao.com/v2/api/talk/memo/default/send",
              headers={"Authorization": f"Bearer {token}"},
              data={"template_object": json.dumps({
                  "object_type": "text",
                  "text": msg,
                  "link": {"web_url": "https://github.com/dhkong01/claude-agents/actions"},
              })},
              timeout=10,
          )
          print("[Kakao] 실패 알림 전송 완료")
          EOF
